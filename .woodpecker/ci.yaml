# Lint dos scripts compartilhados de deploy (push, PR e execução manual).
when:
  - event: [push, pull_request, manual]

steps:
  shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0
    commands:
      - >-
        shellcheck -S warning
        scripts/hel1-deploy scripts/hel1-build scripts/publish-muchat-desktop.sh
        scripts/prune.sh scripts/backup-muhbianco.sh
        scripts/backup-muhbianco-restore-test.sh
        scripts/set-backup-credentials-muhbianco.sh scripts/install-backup-muhbianco.sh
        traefik/apply.sh

  ruff:
    image: python:3.12-slim
    commands:
      - pip install --quiet --disable-pip-version-check ruff==0.16.0
      - ruff check scripts traefik
      - ruff format --check scripts traefik

  # `needed_vars` decide se um deploy roda: errar ali para a producao inteira. Um bug de
  # parser dela ja abortou deploy que teria funcionado, entao virou o primeiro teste do repo.
  # O de traefik/ cobra o que a borda pode gravar no log (query string, headers, DEBUG). Ele
  # mora fora de scripts/ de proposito: scripts/** rebuilda a ci-deployer:1 (deployer.yaml).
  pytest:
    image: python:3.12-slim
    commands:
      - pip install --quiet --disable-pip-version-check pytest==8.4.2
      - python -m pytest -q scripts/tests traefik
