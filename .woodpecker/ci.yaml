# Lint dos scripts compartilhados de deploy (push, PR e execução manual).
when:
  - event: [push, pull_request, manual]

steps:
  shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0
    commands:
      - shellcheck -S warning scripts/hel1-deploy scripts/hel1-build scripts/publish-muchat-desktop.sh scripts/prune.sh

  ruff:
    image: python:3.12-slim
    commands:
      - pip install --quiet --disable-pip-version-check ruff==0.16.0
      - ruff check scripts
      - ruff format --check scripts
